name: Bug report
description: Something in nodch does not work as expected.
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model, and whether it has a notch
      placeholder: MacBook Pro 14-inch, notch
    validations:
      required: true
  - type: input
    id: nod
    attributes:
      label: Nod version and how it runs
      description: Commit or version, and from source or self-hosted.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
