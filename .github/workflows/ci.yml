# Fast gate on a real Mac: build, checks and the app bundle. No Nod server, no model, no network.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: app/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Select latest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          swift --version
      - name: swift build
        run: swift build --package-path app
      - name: NodchChecks
        run: swift run --package-path app NodchChecks
      - name: App bundle
        run: scripts/bundle.sh
